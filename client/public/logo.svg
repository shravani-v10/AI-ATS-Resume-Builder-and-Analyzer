<svg width="200" height="200" viewBox="60 40 380 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D6B"/>
      <stop offset="100%" stop-color="#18C3C8"/>
    </linearGradient>
  </defs>
  <g transform="translate(30,30) scale(1.5)"> </g>
  

  <!-- Outer Ring -->
  <circle cx="230" cy="230" r="170"
          fill="none"
          stroke="url(#grad)"
          stroke-width="12"/>

  <!-- Resume -->
  <rect x="135" y="110" width="180" height="240"
        rx="14"
        fill="white"
        stroke="#0F2D6B"
        stroke-width="8"/>

  <!-- Folded Corner -->
  <polygon points="275,110 315,150 315,110"
           fill="#0F2D6B"/>

  <!-- Avatar -->
  <circle cx="185" cy="165" r="18" fill="#0F2D6B"/>
  <path d="M160 205 C160 182 210 182 210 205 Z"
        fill="#0F2D6B"/>

  <!-- Resume Lines -->
  <line x1="225" y1="160" x2="285" y2="160"
        stroke="#0F2D6B"
        stroke-width="7"
        stroke-linecap="round"/>

  <line x1="225" y1="190" x2="285" y2="190"
        stroke="#18C3C8"
        stroke-width="7"
        stroke-linecap="round"/>

  <line x1="165" y1="245" x2="275" y2="245"
        stroke="#0F2D6B"
        stroke-width="7"
        stroke-linecap="round"/>

  <line x1="165" y1="280" x2="275" y2="280"
        stroke="#0F2D6B"
        stroke-width="7"
        stroke-linecap="round"/>

  <line x1="165" y1="315" x2="250" y2="315"
        stroke="#0F2D6B"
        stroke-width="7"
        stroke-linecap="round"/>

  <!-- Bullets -->
  <circle cx="145" cy="245" r="6" fill="#18C3C8"/>
  <circle cx="145" cy="280" r="6" fill="#18C3C8"/>
  <circle cx="145" cy="315" r="6" fill="#18C3C8"/>

  <!-- Magnifying Glass -->
  <circle cx="300" cy="305" r="58"
          fill="white"
          stroke="#0F2D6B"
          stroke-width="10"/>

  <line x1="340" y1="345"
        x2="380" y2="385"
        stroke="#0F2D6B"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Checkmark -->
  <path d="M278 305 L295 322 L327 288"
        fill="none"
        stroke="#18C3C8"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- AI Circuit -->
  <g stroke="#18C3C8" stroke-width="6" stroke-linecap="round">
    <line x1="315" y1="160" x2="390" y2="160"/>
    <line x1="330" y1="205" x2="420" y2="205"/>
    <line x1="325" y1="250" x2="395" y2="250"/>

    <circle cx="390" cy="160" r="7" fill="#18C3C8"/>
    <circle cx="420" cy="205" r="7" fill="#18C3C8"/>
    <circle cx="395" cy="250" r="7" fill="#18C3C8"/>
  </g>
</svg>